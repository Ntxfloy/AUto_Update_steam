; Steam Auto-Updater - client configuration
; NOTE: this file is a TEMPLATE. Never commit real credentials here.
; The API key is a shared secret for the VPS account pool.

[AutoUpdater]
; Base URL of the account server. Use https:// in production.
server_url=https://your-vps.example.com

; API key issued by the server (see vps-server/.env.example)
api_key=PUT_YOUR_API_KEY_HERE

; Full path to steamcmd.exe on the client PC
steamcmd_path=C:\ProgramData\svc-steam\steamcmd\steamcmd.exe

; Unique identifier of this PC (shown in the server logs / leases)
pc_id=PC-01
